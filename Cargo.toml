[package]
name = "cosmic-theme-switcher"
version = "0.1.0"
edition = "2021"
description = "COSMIC panel applet to toggle between light and dark theme"
license = "MPL-2.0"

[[bin]]
name = "cosmic-theme-switcher"
path = "src/main.rs"

[dependencies]
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
branch = "master"
default-features = false
features = ["applet", "wayland", "tokio"]

[dev-dependencies]
tempfile = "3"
